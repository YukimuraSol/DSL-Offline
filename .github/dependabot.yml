version: 2

updates:
  # npm 依赖：按用途分组，避免每个包各开一个 PR。
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      react:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
      electron:
        patterns:
          - electron
          - electron-builder
      build-tooling:
        patterns:
          - vite
          - '@vitejs/*'
          - 'vite-plugin-*'
          - typescript
          - vitest
          - jsdom
          - '@types/node'

  # workflow 中引用的 action 版本。
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(ci)'
    groups:
      actions:
        patterns: ['*']
