name: 💡 功能建议
description: 提出新功能或改进想法
title: '[Feature] '
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提想法！如果是关于**整合包（Modpack）**的建议，请说明你期望的使用流程 —— 这块正在开发中，反馈很有价值。

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 我已经搜索过现有 Issue 和开发路线图，没有找到相同的建议
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 描述你遇到的实际困难，而不只是想要的功能。
      placeholder: 目前每次换机器都要重新装一遍插件并调整顺序……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你希望启动器怎么做？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其他做法
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: 涉及范围
      multiple: true
      options:
        - 启动与运行
        - 插件管理
        - 整合包
        - 界面与交互
        - 配置与数据
        - 打包与分发
        - 其他
    validations:
      required: false
