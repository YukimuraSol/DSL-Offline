name: 🐛 问题报告
description: 报告启动器的缺陷、崩溃或异常行为
title: '[Bug] '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量填完下面的信息 —— 版本号和运行日志对定位问题帮助最大。

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 我已经搜索过现有 Issue，没有找到相同的问题
          required: true
        - label: 我使用的是最新版本的启动器
          required: false

  - type: input
    id: version
    attributes:
      label: 启动器版本
      description: 见 Release 文件名，例如 v0.1.3
      placeholder: v0.1.3
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: 使用方式
      options:
        - Release 便携版 exe
        - 从源码运行（npm run dev）
        - 从源码打包（npm run package:win）
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: 系统版本
      description: 可在「设置 → 系统 → 关于」查看
      placeholder: Windows 11 23H2 (x64)
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 实际发生了什么？
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开启动器
        2. 进入「发现插件」
        3. 搜索 xxx 并点击安装
        4. 出现 xxx 错误
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你认为正确的结果应该是什么？
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: 运行日志
      description: 从「运行与日志」页面复制相关内容。会自动按代码块渲染，无需加反引号。
      render: text
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 截图、相关插件仓库、其他线索等
    validations:
      required: false
